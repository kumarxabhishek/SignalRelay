[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signalrelay-mcp"
version = "0.1.0"
description = "SignalRelay: a grounded MCP server for NSE market data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.14,<2",
  "yfinance>=0.2.54,<1",
  "anthropic>=0.50,<1",
  "fastapi>=0.115,<1",
  "langgraph>=0.2,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
signalrelay-mcp = "server.app:main"
signalrelay-api = "api.app:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["api", "data_layer", "server", "signals", "explanation"]

[tool.signalrelay.nse_mcp]
repository = "https://github.com/manitgupta/NSE-MCP.git"
commit = "8fe76bc51fc2beb5013eb252592b285be8e1b5c0"
entrypoint = ".vendor/NSE-MCP/dist/index.js"
